<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 840 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Trust chain diagram">
<style>
  svg { font-family: Roboto, Helvetica, Arial, sans-serif; }
  .lane { stroke: #DADCE0; stroke-width: 1; }
  .box { fill: #F8F9FA; stroke: #5F6368; stroke-width: 1; }
  .boxlbl { font-size: 13.5px; font-weight: 500; fill: #202124; }
  .msg { stroke: #5F6368; stroke-width: 1; }
  .mk { fill: #5F6368; }
  .lbl { font-size: 12.5px; fill: #202124; paint-order: stroke; stroke: #FFFFFF; stroke-width: 6px; stroke-linejoin: round; }
  .note { font-size: 11px; fill: #5F6368; paint-order: stroke; stroke: #FFFFFF; stroke-width: 5px; stroke-linejoin: round; }
  .phase { stroke: #DADCE0; stroke-dasharray: 3 4; }
  .phasebg { fill: #FFFFFF; }
  .phaselbl { font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; fill: #5F6368; font-weight: 500; }
  .selfbox { fill: #F1F3F4; stroke: #DADCE0; }
  .cbox { fill: #F8F9FA; stroke: #5F6368; }
  .cbox.root { fill: #E8F0FE; stroke: #1A73E8; }
  .ctitle { font-size: 13.5px; font-weight: 500; fill: #202124; }
  .cline { font-size: 11.5px; fill: #3C4043; }
  .clink { stroke: #5F6368; stroke-width: 1; }
</style>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<defs><marker id="ch-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="mk" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="cbox root" x="320" y="16" width="200" height="44" rx="4"/>
<text class="ctitle" x="332" y="38">Foil root key</text>
<rect class="cbox " x="60" y="100" width="300" height="92" rx="4"/>
<text class="ctitle" x="72" y="122">Operator certificate</text>
<text class="cline" x="72" y="142">Issued by Foil</text>
<text class="cline" x="72" y="158">Subject: operator id, operator public key</text>
<text class="cline" x="72" y="174">Attributes: vetting level, session-handling attestation</text>
<rect class="cbox " x="480" y="100" width="300" height="92" rx="4"/>
<text class="ctitle" x="492" y="122">Site policy statement</text>
<text class="cline" x="492" y="142">Issued by Foil from the dashboard</text>
<text class="cline" x="492" y="158">Subject: site origin, version</text>
<text class="cline" x="492" y="174">Tier ceiling, allowed agents, constraints, disclosures</text>
<rect class="cbox " x="60" y="222" width="300" height="76" rx="4"/>
<text class="ctitle" x="72" y="244">Agent certificate</text>
<text class="cline" x="72" y="264">Issued by the operator</text>
<text class="cline" x="72" y="280">Subject: agent id, agent public key</text>
<text class="cline" x="72" y="296">Ceiling: scopes and constraints</text>
<rect class="cbox " x="270" y="330" width="300" height="76" rx="4"/>
<text class="ctitle" x="282" y="352">Delegation certificate</text>
<text class="cline" x="282" y="372">Issued by Foil (site or consumer later)</text>
<text class="cline" x="282" y="388">Subject: agent, consumer subject, site</text>
<text class="cline" x="282" y="404">Scopes = ceiling ∩ policy ∩ acceptance</text>
<line class="clink" x1="400" y1="60" x2="210" y2="100" marker-end="url(#ch-ah)"/>
<line class="clink" x1="440" y1="60" x2="630" y2="100" marker-end="url(#ch-ah)"/>
<line class="clink" x1="210" y1="192" x2="210" y2="222" marker-end="url(#ch-ah)"/>
<line class="clink" x1="210" y1="298" x2="340" y2="330" marker-end="url(#ch-ah)"/>
<line class="clink" x1="630" y1="192" x2="500" y2="330" marker-end="url(#ch-ah)"/>
<text class="cline" x="590" y="392">Grant: issued by the agent per session, scopes ⊆ delegation</text>
</svg>